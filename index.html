<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClinicFlow Mock</title><link rel="stylesheet" href="styles.css"></head><body><header><b>CLINICFLOW</b><span>Real-time patient flow management</span><nav><a href="?view=staff">Staff</a><a href="?view=patient">Patient</a><a href="?view=doctor">Doctor</a><a href="?view=board">Public Board</a></nav></header><main><div class="intro"><small>DR. RAO — ENT · ROOM 2</small><h1>Appointments. Walk-ins. Waiting. Calling. Delays. One live queue.</h1><p>This is the first clickable mock. The queue advances automatically so we can review the workflow before building the backend.</p></div><section id="view"></section></main><script src="mock-data.js"></script><script>const view=new URLSearchParams(location.search).get("view")||"staff";const root=document.getElementById("view");function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function render(s){let h="";if(view==="patient"){const p=s.allWaiting.find(x=>x.token==="06");h='<div class="hero card"><small>YOUR TOKEN</small><strong>06</strong><p>Checked in → Waiting</p></div><div class="metrics"><div class="card"><small>PATIENTS AHEAD</small><b>'+p.ahead+'</b></div><div class="card"><small>ESTIMATED WAIT</small><b>'+p.eta[0]+'–'+p.eta[1]+' min</b></div></div><div class="card"><h2>NOW CONSULTING</h2><b class="token">'+(s.consulting?s.consulting.token:"—")+'</b><p>'+s.status+' · updated just now</p><button onclick="alert(\'Mock: Return Later\')">Return Later</button></div>'}else if(view==="board"){h='<div class="board"><div class="card"><small>NOW CONSULTING</small><b class="token">'+(s.consulting?s.consulting.token:"—")+'</b></div><div class="card"><h2>NEXT</h2><div class="tokens">'+s.next.map(p=>'<b>'+p.token+'</b>').join("")+'</div></div><div class="card wide"><small>WAITING</small><div class="tokens">'+s.waiting.map(p=>'<b>'+p.token+'</b>').join("")+'</div></div><div class="metrics"><div class="card"><small>ESTIMATED WAIT</small><b>'+s.allWaiting[0].eta[0]+'–'+s.allWaiting[0].eta[1]+' min</b></div><div class="card"><small>QUEUE STATUS</small><b>'+s.status+'</b></div></div></div>'}else if(view==="doctor"){h='<div class="metrics"><div class="card"><small>COMPLETED</small><b>'+s.completed+'/14</b></div><div class="card"><small>AVG CONSULT</small><b>'+s.avg+' min</b></div><div class="card"><small>WAITING</small><b>'+s.allWaiting.length+'</b></div><div class="card"><small>BACKLOG</small><b>'+Math.round(s.allWaiting.length*s.avg)+' min</b></div></div><div class="card"><h2>NOW</h2><b class="token">'+(s.consulting?s.consulting.token:"—")+'</b><p>'+(s.consulting?esc(s.consulting.name):"Idle")+'</p></div>'}else{h='<div class="metrics"><div class="card"><small>WAITING</small><b>'+s.allWaiting.length+'</b></div><div class="card"><small>COMPLETED</small><b>'+s.completed+'/14</b></div><div class="card"><small>AVG CONSULT</small><b>'+s.avg+' min</b></div><div class="card"><small>STATUS</small><b>'+s.status+'</b></div></div><div class="cols"><div class="card"><h2>NOW CONSULTING</h2><b class="token">'+(s.consulting?s.consulting.token:"—")+'</b><p>'+(s.consulting?esc(s.consulting.name):"Idle")+'</p></div><div class="card"><h2>NEXT</h2>'+s.next.map(p=>'<p><b>'+p.token+'</b> · '+esc(p.name)+'</p>').join("")+'</div><div class="card wide"><h2>WAITING</h2>'+s.waiting.map(p=>'<p><b>'+p.token+'</b> · '+esc(p.name)+' <span class="muted">'+p.ahead+' ahead</span></p>').join("")+'</div><div class="card"><h2>NOT ARRIVED</h2><p>09</p><p>10</p></div></div>'}root.innerHTML=h}render(ClinicFlowMock.snapshot());ClinicFlowMock.subscribe(render);setInterval(()=>document.querySelector("header span").textContent=new Date().toLocaleTimeString("en-IN"),1000);</script></body></html>
