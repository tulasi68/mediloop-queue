<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinicFlow</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#fff;border-bottom:1px solid #dfe5ec;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
header strong{letter-spacing:.12em}header span{display:block;color:#64748b;font-size:13px;margin-top:3px}
main{max-width:900px;margin:0 auto;padding:28px 20px}.clinic{color:#64748b;margin-bottom:8px}
h1{font-size:34px;margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:20px}.label{color:#64748b;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.value{font-size:30px;font-weight:800;margin-top:8px}.sub{color:#64748b;font-size:13px;margin-top:4px}
.queue{background:#fff;border:1px solid #dfe5ec;border-radius:14px;overflow:hidden}.queue-head{padding:16px 18px;border-bottom:1px solid #e8edf2;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid #edf1f5}.row:last-child{border-bottom:0}
.token{font-weight:800;font-size:20px;min-width:70px}.name{flex:1}.position{color:#64748b;font-size:13px}
.empty{text-align:center;padding:45px 20px;color:#64748b}.status{margin-top:14px;color:#64748b;font-size:13px}
@media(max-width:650px){.cards{grid-template-columns:1fr}.value{font-size:26px}}
</style>
</head>
<body>
<header><div><strong>CLINICFLOW</strong><span>Real-time patient queue</span></div><span id="connection">Waiting for MediLoop</span></header>
<main>
<div class="clinic" id="clinic">MediLoop Clinical AI</div>
<h1>Today's Queue</h1>
<section class="cards">
<div class="card"><div class="label">New patient</div><div class="value" id="added">—</div><div class="sub" id="addedSub">Waiting for registration</div></div>
<div class="card"><div class="label">Completed</div><div class="value" id="completed">—</div><div class="sub" id="completedSub">Waiting for update</div></div>
<div class="card"><div class="label">Patients remaining</div><div class="value" id="remaining">0</div><div class="sub">In today's queue</div></div>
</section>
<section class="queue"><div class="queue-head">Live queue</div><div id="queue"><div class="empty">Waiting for MediLoop Clinical AI to send today's queue.</div></div></section>
<div class="status" id="status">No queue update received.</div>
</main>
<script>
const ALLOWED_ORIGINS=new Set(["https://mediloop-ai.vercel.app","http://localhost:3000","http://localhost:3001"]);
const state={patients:[],remainingCount:0,latestAdded:null,latestCompleted:null,clinicName:"MediLoop Clinical AI"};
const $=id=>document.getElementById(id);
function cleanPatient(p){return p&&typeof p==="object"?{id:String(p.id??""),token:String(p.token??""),name:String(p.name??"")}:null}
function render(){
$("clinic").textContent=state.clinicName||"MediLoop Clinical AI";
$("remaining").textContent=String(state.remainingCount);
$("added").textContent=state.latestAdded?.token||"—";
$("addedSub").textContent=state.latestAdded?.name||"Waiting for registration";
$("completed").textContent=state.latestCompleted?.token||"—";
$("completedSub").textContent=state.latestCompleted?.name||"Waiting for completion";
const patients=state.patients.map(cleanPatient).filter(Boolean);
$("queue").innerHTML=patients.length?patients.map((p,i)=>'<div class="row"><span class="token">'+escapeHtml(p.token||String(i+1))+'</span><span class="name">'+escapeHtml(p.name||"Patient")+'</span><span class="position">'+(i===0?"NEXT":"WAITING")+'</span></div>').join(""):'<div class="empty">No patients remaining.</div>';
}
  
function escapeHtml(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function accept(data){
if(!data||data.source!=="mediloop-ai"||data.type!=="QUEUE_UPDATE")return;
const p=data.patient?cleanPatient(data.patient):null;
if(Array.isArray(data.patients))state.patients=data.patients.map(cleanPatient).filter(Boolean);
if(Number.isFinite(Number(data.remainingCount)))state.remainingCount=Number(data.remainingCount);
if(data.clinicName)state.clinicName=String(data.clinicName);
if(data.action==="added"&&p)state.latestAdded=p;
if(data.action==="completed"&&p)state.latestCompleted=p;
$("connection").textContent="Connected to MediLoop";
$("status").textContent="Queue updated "+new Date().toLocaleTimeString("en-IN");
render();
}
window.addEventListener("message",event=>{
if(!ALLOWED_ORIGINS.has(event.origin))return;
accept(event.data);
if(event.source&&typeof event.source.postMessage==="function")event.source.postMessage({source:"clinicflow",type:"QUEUE_READY"},event.origin);
});
if(window.parent!==window&&document.referrer){
try{
const origin=new URL(document.referrer).origin;
if(ALLOWED_ORIGINS.has(origin))window.parent.postMessage({source:"clinicflow",type:"QUEUE_READY"},origin);
}catch{}
}
render();
</script>
</body>
</html>
